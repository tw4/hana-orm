title: hana-orm
description: A type-safe TypeScript ORM for SAP HANA
url: https://tw4.github.io
baseurl: /hana-orm
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme

color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 2
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  GitHub: https://github.com/tw4/hana-orm
  npm: https://www.npmjs.com/package/hana-orm
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/tw4/hana-orm/blob/main/CHANGELOG.md
    hide_icon: false

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/tw4/hana-orm"
gh_edit_branch: "main"
gh_edit_source: docs
gh_edit_view_mode: "edit"

callouts:
  note:
    title: Note
    color: blue
  tip:
    title: Tip
    color: green
  warning:
    title: Warning
    color: yellow
  danger:
    title: Danger
    color: red

footer_content: "Apache License 2.0. SAP and SAP HANA are trademarks of SAP SE; hana-orm is not affiliated with SAP."

exclude:
  - README.md
