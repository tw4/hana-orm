# Local SAP HANA Express for development and integration tests.
#
#   1. Create .local/hxe/password.json: {"master_password":"<8+ chars, upper, lower, digit>"}
#   2. docker compose -f docker-compose.hana.yml up -d   (first start takes ~10 minutes)
#   3. Put the connection into .env.test (ignored by git):
#        HANA_HOST=localhost  HANA_PORT=39041  HANA_USER=SYSTEM  HANA_PASSWORD=...  HANA_DATABASE=HXE
#   4. HANA_ORM_ENV_FILE=.env.test npm run test:integration
#      (HANA_ORM_ALLOW_DDL=1 also runs the migration tests)
#
# Notes:
#   - HANA deletes password.json after the first start. To start from scratch, empty
#     .local/hxe and create password.json again.
#   - It needs ~10 GB of free disk; with less, the log volume fills up and the start hangs.
#   - The image is amd64 only. On Apple Silicon the tenant database does not start under
#     emulation; run the container on an amd64 machine and set HANA_HOST to it in .env.test.
#     The connection is not encrypted, so use it on a trusted network only.
#   - docker/hana-seccomp.json is Docker's default seccomp profile (moby v27.3.1) plus the
#     NUMA syscalls HANA needs (mbind, move_pages, get/set_mempolicy).
#
# Starting the container accepts the SAP HANA Express license (--agree-to-sap-license):
# https://www.sap.com/about/legal/agreements.html
services:
  hana:
    image: saplabs/hanaexpress:latest
    container_name: hana-orm-hxe
    hostname: hxehost
    command: ["--passwords-url", "file:///hana/mounts/password.json", "--agree-to-sap-license"]
    ports:
      - "39013:39013" # SYSTEMDB SQL
      - "39017:39017"
      - "39041:39041" # tenant HXE SQL
    platform: linux/amd64
    # Docker's default seccomp profile plus the NUMA syscalls HANA uses (mbind, move_pages).
    security_opt:
      - seccomp=./docker/hana-seccomp.json
    ulimits:
      nofile: 1048576
    sysctls:
      kernel.shmmax: 1073741824
      net.ipv4.ip_local_port_range: "40000 60999"
      kernel.shmmni: 4096
      kernel.shmall: 8388608
    volumes:
      - ./.local/hxe:/hana/mounts
