name: HANA integration

# Runs the integration tests (including DDL/migration tests) against SAP HANA Express started
# from docker-compose.hana.yml. HANA Express needs ~10 GB of disk and ~8 GB of RAM and takes
# about 10 minutes to start, so this runs nightly and on demand rather than on every push.
#
# Starting the container accepts the SAP HANA Express license (--agree-to-sap-license):
# https://www.sap.com/about/legal/agreements.html

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (e.g. ubuntu-latest, a larger runner, or self-hosted)"
        required: false
        default: ubuntu-latest

permissions:
  contents: read

concurrency:
  group: hana-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 75
    env:
      HANA_ORM_ENV_FILE: .env.test
      HANA_ORM_ALLOW_DDL: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for HANA Express
        if: ${{ !contains(inputs.runner || 'ubuntu-latest', 'self-hosted') }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts

      - name: Create the HANA master password
        run: |
          # 8+ characters with upper case, lower case and a digit; generated per run and masked
          pw="Hxe$(openssl rand -hex 12)A1"
          echo "::add-mask::$pw"
          echo "HANA_MASTER_PASSWORD=$pw" >> "$GITHUB_ENV"
          mkdir -p .local/hxe
          printf '{"master_password":"%s"}' "$pw" > .local/hxe/password.json
          # the container runs as hxeadm (uid 12000, group sapsys 79)
          sudo chown -R 12000:79 .local/hxe
          sudo chmod 600 .local/hxe/password.json

      - name: Start HANA Express
        run: docker compose -f docker-compose.hana.yml up -d

      - name: Wait for HANA Express
        run: |
          for i in $(seq 1 120); do
            if docker logs hana-orm-hxe 2>&1 | grep -q "Startup finished"; then
              echo "HANA Express is up after ~$((i * 15))s"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' hana-orm-hxe)" != "true" ]; then
              echo "The container stopped"; docker logs --tail 200 hana-orm-hxe; exit 1
            fi
            sleep 15
          done
          echo "HANA Express did not start within 30 minutes"; docker logs --tail 200 hana-orm-hxe; exit 1

      - name: Write the test connection
        run: |
          {
            echo "HANA_HOST=localhost"
            echo "HANA_PORT=39041"
            echo "HANA_USER=SYSTEM"
            echo "HANA_PASSWORD=$HANA_MASTER_PASSWORD"
            echo "HANA_DATABASE=HXE"
          } > .env.test

      - name: Check the connection
        run: node scripts/check-hana.ts

      - name: Integration tests
        run: |
          npm run test:integration 2>&1 | tee integration.log
          # skipped tests would make a green run meaningless: every test must have run
          if ! grep -Eq "^ℹ skipped 0$" integration.log; then
            echo "::error::Some integration tests were skipped"; exit 1
          fi

      - name: HANA logs
        if: failure()
        run: docker logs --tail 500 hana-orm-hxe > hana.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: hana-integration-logs
          path: |
            integration.log
            hana.log
          retention-days: 7

      - name: Stop HANA Express
        if: always()
        run: docker compose -f docker-compose.hana.yml down -v || true
